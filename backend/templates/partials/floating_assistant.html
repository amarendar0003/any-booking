{% load static %}
<!-- ── Floating Actions & Assistant Chatbot ── -->
<div class="floating-actions-dock" id="floatingActionsDock">
  <!-- Book Now Button (Redirects to Services Page) -->
  <a href="{% url 'service_list' %}" class="floating-pill-btn floating-book-btn" id="floatingBookBtn" title="Explore and Book Services">
    <i class="bi bi-calendar2-check-fill"></i>
    <span>Book Now</span>
  </a>

  <!-- Ask Assistant Button (Toggles Chatbot Interface) -->
  <button type="button" class="floating-pill-btn floating-assistant-btn" id="floatingAssistantBtn" aria-label="Ask Assistant" title="Chat with Assistant">
    <i class="bi bi-chat-dots-fill"></i>
    <span>Ask Assistant</span>
  </button>
</div>

<!-- Chatbot Interface Window -->
<div class="chatbot-window" id="chatbotWindow" aria-hidden="true" role="dialog" aria-labelledby="chatbotTitle">
  <!-- Chat Header -->
  <div class="chatbot-header">
    <div class="chatbot-header-info">
      <div class="chatbot-avatar-wrap">
        <img src="{% static 'img/AnyBookingMainLogo.jpg' %}" alt="AnyBooking" class="chatbot-avatar-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="chatbot-avatar-fallback" style="display:none;">
          <i class="bi bi-robot"></i>
        </div>
      </div>
      <div>
        <div class="chatbot-title" id="chatbotTitle">AnyBooking Assistant</div>
        <div class="chatbot-status">
          <span class="chatbot-status-dot"></span>
          <span>Online</span>
        </div>
      </div>
    </div>
    <button type="button" class="chatbot-close-btn" id="chatbotCloseBtn" aria-label="Close Assistant">&times;</button>
  </div>

  <!-- Chat Messages Body -->
  <div class="chatbot-body" id="chatbotBody">
    <!-- Initial Greeting Message -->
    <div class="chatbot-msg chatbot-msg-bot">
      <div class="chatbot-bubble">
        👋 Hello! How can I help you today?
      </div>
    </div>

    <!-- Suggestion Chips for Fast Interaction -->
    <div class="chatbot-suggestions" id="chatbotSuggestions">
      <button type="button" class="chatbot-chip" data-msg="I want to book a banquet hall">Banquet Halls</button>
      <button type="button" class="chatbot-chip" data-msg="What event services do you offer?">Our Services</button>
      <button type="button" class="chatbot-chip" data-msg="How does booking work?">How to Book</button>
    </div>
  </div>

  <!-- Chat Input Footer -->
  <form class="chatbot-footer" id="chatbotForm" onsubmit="return false;">
    <input type="text" class="chatbot-input" id="chatbotInput" placeholder="Type your message..." autocomplete="off">
    <button type="submit" class="chatbot-send-btn" id="chatbotSendBtn">Send</button>
  </form>
</div>

<style>
/* ── Floating Actions Dock (Rightmost Middle Position) ── */
.floating-actions-dock {
  position: fixed;
  top: 50%;
  right: 18px;
  transform: translateY(-50%);
  z-index: 1050;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), filter 0.28s ease;
  animation: dockAmbientFloat 4s ease-in-out infinite;
  will-change: transform;
}

/* Ambient idle floating effect */
@keyframes dockAmbientFloat {
  0%, 100% {
    transform: translateY(-50%);
  }
  50% {
    transform: translateY(calc(-50% - 5px));
  }
}

/* ── Dynamic Scroll Effects ── */
.floating-actions-dock.is-scrolling {
  animation: none; /* Pause idle float while scrolling */
  filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.15));
}

/* Scrolling Down Effect */
.floating-actions-dock.is-scrolling[data-scroll-dir="down"] {
  transform: translateY(calc(-50% + 5px)) scale(1.05) rotate(-1.5deg);
}

/* Scrolling Up Effect */
.floating-actions-dock.is-scrolling[data-scroll-dir="up"] {
  transform: translateY(calc(-50% - 5px)) scale(1.05) rotate(1.5deg);
}

/* Base button pill */
.floating-pill-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-width: 155px;
  padding: 12px 22px;
  border-radius: 50px;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 0.94rem;
  font-weight: 600;
  text-decoration: none;
  border: none;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
}

/* Shimmer light-sweep effect on buttons */
.floating-pill-btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -120%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
  transform: skewX(-20deg);
  transition: none;
}

/* Trigger light sweep during scroll */
.floating-actions-dock.is-scrolling .floating-pill-btn::after {
  animation: btnScrollShimmer 1.1s infinite cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes btnScrollShimmer {
  0% { left: -120%; }
  100% { left: 180%; }
}

/* Book Now Button (Brand Orange) */
.floating-book-btn {
  background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
  color: #ffffff !important;
  box-shadow: 0 5px 20px rgba(249, 115, 22, 0.38);
}

.floating-book-btn:hover {
  background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
  color: #ffffff !important;
  transform: translateX(-4px) scale(1.02);
  box-shadow: 0 8px 26px rgba(249, 115, 22, 0.52);
}

/* Enhanced glow on Book Now during scroll */
.floating-actions-dock.is-scrolling .floating-book-btn {
  box-shadow: 0 8px 28px rgba(249, 115, 22, 0.6), 0 0 16px rgba(249, 115, 22, 0.35);
}

/* Ask Assistant Button (Blue - matching user screenshot) */
.floating-assistant-btn {
  background: linear-gradient(135deg, #0d6efd 0%, #0056b3 100%);
  color: #ffffff !important;
  box-shadow: 0 5px 20px rgba(13, 110, 253, 0.38);
}

.floating-assistant-btn:hover {
  background: linear-gradient(135deg, #0b5ed7 0%, #004494 100%);
  color: #ffffff !important;
  transform: translateX(-4px) scale(1.02);
  box-shadow: 0 8px 26px rgba(13, 110, 253, 0.52);
}

/* Enhanced glow on Ask Assistant during scroll */
.floating-actions-dock.is-scrolling .floating-assistant-btn {
  box-shadow: 0 8px 28px rgba(13, 110, 253, 0.6), 0 0 16px rgba(13, 110, 253, 0.35);
}

.floating-assistant-btn.active {
  box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.4), 0 8px 24px rgba(13, 110, 253, 0.48);
}

/* ── Chatbot Window (Anchored with Right-Middle Dock) ── */
.chatbot-window {
  position: fixed;
  top: 50%;
  right: 195px;
  transform: translateY(-50%) scale(0.96);
  width: 360px;
  max-width: calc(100vw - 32px);
  height: 510px;
  max-height: min(520px, calc(100vh - 120px));
  background: #ffffff;
  border-radius: 16px;
  box-shadow: 0 18px 46px rgba(0, 0, 0, 0.2), 0 4px 14px rgba(0, 0, 0, 0.08);
  border: 1px solid rgba(0, 0, 0, 0.08);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 1060;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.24s;
}

.chatbot-window.is-open {
  opacity: 1;
  visibility: visible;
  transform: translateY(-50%) scale(1);
}

/* Header */
.chatbot-header {
  background: #0d6efd;
  color: #ffffff;
  padding: 13px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.chatbot-header-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.chatbot-avatar-wrap {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1.5px solid rgba(255, 255, 255, 0.7);
}

.chatbot-avatar-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.chatbot-avatar-fallback {
  color: #0d6efd;
  font-size: 1.1rem;
}

.chatbot-title {
  font-size: 0.98rem;
  font-weight: 700;
  line-height: 1.2;
}

.chatbot-status {
  font-size: 0.73rem;
  color: rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 1px;
}

.chatbot-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background-color: #22c55e;
}

.chatbot-close-btn {
  background: transparent;
  border: none;
  color: #ffffff;
  font-size: 1.5rem;
  line-height: 1;
  padding: 0 4px;
  cursor: pointer;
  opacity: 0.85;
  transition: opacity 0.15s ease;
}
.chatbot-close-btn:hover {
  opacity: 1;
}

/* Messages Body */
.chatbot-body {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background-color: #f8fafc;
}

.chatbot-msg {
  display: flex;
  flex-direction: column;
  max-width: 85%;
}

.chatbot-msg-bot {
  align-self: flex-start;
}

.chatbot-msg-bot .chatbot-bubble {
  background-color: #eef4ff;
  color: #1e293b;
  padding: 10px 14px;
  border-radius: 14px 14px 14px 2px;
  font-size: 0.91rem;
  line-height: 1.45;
  border: 1px solid #dbeafe;
}

.chatbot-msg-user {
  align-self: flex-end;
}

.chatbot-msg-user .chatbot-bubble {
  background-color: #0d6efd;
  color: #ffffff;
  padding: 10px 14px;
  border-radius: 14px 14px 2px 14px;
  font-size: 0.91rem;
  line-height: 1.45;
}

/* Suggestion chips */
.chatbot-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}

.chatbot-chip {
  background: #ffffff;
  border: 1px solid #cbd5e1;
  color: #334155;
  font-size: 0.8rem;
  padding: 5px 10px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.chatbot-chip:hover {
  background: #0d6efd;
  color: #ffffff;
  border-color: #0d6efd;
}

/* Typing placeholder */
.chatbot-typing {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 12px;
  background: #eef4ff;
  border-radius: 14px;
  width: fit-content;
}
.chatbot-typing span {
  width: 6px;
  height: 6px;
  background: #0d6efd;
  border-radius: 50%;
  animation: typingBlink 1.2s infinite ease-in-out both;
}
.chatbot-typing span:nth-child(2) { animation-delay: 0.2s; }
.chatbot-typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBlink {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* Footer / Input */
.chatbot-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  background: #ffffff;
  border-top: 1px solid #e2e8f0;
}

.chatbot-input {
  flex: 1;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 0.9rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s ease;
}
.chatbot-input:focus {
  border-color: #0d6efd;
  box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
}

.chatbot-send-btn {
  background: #0d6efd;
  color: #ffffff;
  border: none;
  border-radius: 6px;
  padding: 8px 18px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.15s ease;
}
.chatbot-send-btn:hover {
  background: #0b5ed7;
}

/* Responsive for Tablets & Mobile */
@media (max-width: 860px) {
  .floating-actions-dock {
    right: 12px;
    gap: 8px;
  }
  .floating-pill-btn {
    min-width: 140px;
    padding: 10px 16px;
    font-size: 0.88rem;
  }
  .chatbot-window {
    top: auto;
    bottom: 20px;
    right: 12px;
    width: calc(100vw - 24px);
    max-height: 75vh;
    transform: translateY(20px) scale(0.96);
  }
  .chatbot-window.is-open {
    transform: translateY(0) scale(1);
  }
}
</style>

<script>
(function() {
  const assistantBtn = document.getElementById('floatingAssistantBtn');
  const chatWindow = document.getElementById('chatbotWindow');
  const closeBtn = document.getElementById('chatbotCloseBtn');
  const chatForm = document.getElementById('chatbotForm');
  const chatInput = document.getElementById('chatbotInput');
  const chatBody = document.getElementById('chatbotBody');
  const suggestionContainer = document.getElementById('chatbotSuggestions');
  const dock = document.getElementById('floatingActionsDock');

  if (!assistantBtn || !chatWindow) return;

  /* ── Scroll Effect Handler ── */
  let scrollTimer = null;
  let lastScrollY = window.scrollY;

  window.addEventListener('scroll', function() {
    if (!dock) return;
    const currentScrollY = window.scrollY;
    const delta = currentScrollY - lastScrollY;
    lastScrollY = currentScrollY;

    // Apply active scrolling effect
    dock.classList.add('is-scrolling');
    if (delta > 0) {
      dock.setAttribute('data-scroll-dir', 'down');
    } else if (delta < 0) {
      dock.setAttribute('data-scroll-dir', 'up');
    }

    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function() {
      dock.classList.remove('is-scrolling');
      dock.removeAttribute('data-scroll-dir');
    }, 280);
  }, { passive: true });

  /* ── Chat Open / Close ── */
  function openChat() {
    chatWindow.classList.add('is-open');
    chatWindow.setAttribute('aria-hidden', 'false');
    assistantBtn.classList.add('active');
    setTimeout(() => { if (chatInput) chatInput.focus(); }, 150);
  }

  function closeChat() {
    chatWindow.classList.remove('is-open');
    chatWindow.setAttribute('aria-hidden', 'true');
    assistantBtn.classList.remove('active');
  }

  assistantBtn.addEventListener('click', function(e) {
    e.preventDefault();
    if (chatWindow.classList.contains('is-open')) {
      closeChat();
    } else {
      openChat();
    }
  });

  if (closeBtn) {
    closeBtn.addEventListener('click', function(e) {
      e.preventDefault();
      closeChat();
    });
  }

  // Close on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && chatWindow.classList.contains('is-open')) {
      closeChat();
    }
  });

  function formatReply(text) {
    if (!text) return '';
    let escaped = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    escaped = escaped.replace(/\*(.*?)\*/g, '<em>$1</em>');
    escaped = escaped.replace(/\n/g, '<br>');
    return escaped;
  }

  function appendBotMessage(text, isFormatted) {
    const msgDiv = document.createElement('div');
    msgDiv.className = 'chatbot-msg chatbot-msg-bot';
    msgDiv.innerHTML = `<div class="chatbot-bubble">${isFormatted ? text : formatReply(text)}</div>`;
    chatBody.appendChild(msgDiv);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function appendUserMessage(text) {
    const msgDiv = document.createElement('div');
    msgDiv.className = 'chatbot-msg chatbot-msg-user';
    const bubble = document.createElement('div');
    bubble.className = 'chatbot-bubble';
    bubble.textContent = text;
    msgDiv.appendChild(bubble);
    chatBody.appendChild(msgDiv);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  const conversationHistory = [];

  async function handleSend(userText) {
    if (!userText || !userText.trim()) return;
    const cleanText = userText.trim();
    appendUserMessage(cleanText);

    // Record user turn in memory
    conversationHistory.push({ role: 'user', content: cleanText });

    // Hide suggestions after first interaction
    if (suggestionContainer) {
      suggestionContainer.style.display = 'none';
    }

    // Display animated typing indicator
    const typingDiv = document.createElement('div');
    typingDiv.className = 'chatbot-msg chatbot-msg-bot';
    typingDiv.id = 'botTypingIndicator';
    typingDiv.innerHTML = '<div class="chatbot-typing"><span></span><span></span><span></span></div>';
    chatBody.appendChild(typingDiv);
    chatBody.scrollTop = chatBody.scrollHeight;

    try {
      const response = await fetch('/ajax/chat/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          message: cleanText,
          history: conversationHistory.slice(-8)
        })
      });

      const indicator = document.getElementById('botTypingIndicator');
      if (indicator) indicator.remove();

      if (!response.ok) {
        throw new Error('Server returned ' + response.status);
      }

      const data = await response.json();
      const botReply = data.reply || "I'm here to help! Please let me know what event or venue you're planning.";
      
      // Record bot turn in memory
      conversationHistory.push({ role: 'assistant', content: botReply });
      appendBotMessage(botReply);

    } catch (err) {
      const indicator = document.getElementById('botTypingIndicator');
      if (indicator) indicator.remove();

      appendBotMessage(
        "Thank you for your message! Our assistant is currently connecting to services. " +
        "You can explore all our venues and vendors anytime by clicking the 'Book Now' button above!"
      );
    }
  }

  if (chatForm) {
    chatForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const val = chatInput.value;
      if (val) {
        handleSend(val);
        chatInput.value = '';
      }
    });
  }

  // Quick suggestion chips click handler
  if (suggestionContainer) {
    suggestionContainer.addEventListener('click', function(e) {
      const chip = e.target.closest('.chatbot-chip');
      if (chip && chip.dataset.msg) {
        handleSend(chip.dataset.msg);
      }
    });
  }
})();
</script>
